AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudSynergy Core Infrastructure
  - VPC with Public & Private Subnets
  - Internet Gateway
  - Route Table
  - EC2 Instance (Public Subnet)
  - Pipeline-safe & production-ready

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
    Description: EC2 instance type

Resources:

  # -------------------------
  # VPC
  # -------------------------
  CloudSynergyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: CloudSynergy-VPC

  # -------------------------
  # Internet Gateway
  # -------------------------
  CloudSynergyIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: CloudSynergy-IGW

  AttachIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref CloudSynergyVPC
      InternetGatewayId: !Ref CloudSynergyIGW

  # -------------------------
  # Public Subnet
  # -------------------------
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudSynergyVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: CloudSynergy-Public-Subnet

  # -------------------------
  # Private Subnet
  # -------------------------
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudSynergyVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: CloudSynergy-Private-Subnet

  # -------------------------
  # Route Table
  # -------------------------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CloudSynergyVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachIGW
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref CloudSynergyIGW

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # -------------------------
  # Security Group (NO SSH)
  # -------------------------
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP only
      VpcId: !Ref CloudSynergyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: CloudSynergy-Web-SG

  # -------------------------
  # EC2 Instance
  # -------------------------
  CloudSynergyEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebSecurityGroup

      # Dynamic AMI (Ubuntu 22.04)
      ImageId: !Sub "{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id}}"

      Tags:
        - Key: Name
          Value: CloudSynergy-SynergyCRM-EC2

Outputs:
  VPCId:
    Value: !Ref CloudSynergyVPC

  EC2PublicIP:
    Value: !GetAtt CloudSynergyEC2.PublicIp
